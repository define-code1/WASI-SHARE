<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle circular radar rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="8" stroke-dasharray="16 16" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" />

  <!-- Center Wireless Beam Symbol -->
  <g transform="translate(256, 256) scale(1.6) translate(-24, -24)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Dot -->
    <circle cx="24" cy="24" r="4" fill="#ffffff" />
    
    <!-- Top Arc -->
    <path d="M12 16a16 16 0 0 1 24 0" stroke-width="3.5" />
    <path d="M6 10a24 24 0 0 1 36 0" stroke-width="3.5" />
    
    <!-- Bottom Arc -->
    <path d="M12 32a16 16 0 0 0 24 0" stroke-width="3.5" />
    <path d="M6 38a24 24 0 0 0 36 0" stroke-width="3.5" />
    
    <!-- Up/Down arrows representing transfer -->
    <path d="M24 6v8" stroke="url(#glow)" stroke-width="3.5" />
    <path d="M24 34v8" stroke="url(#glow)" stroke-width="3.5" />
  </g>
</svg>
